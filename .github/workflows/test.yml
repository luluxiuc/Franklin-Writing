name: 测试

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 主测试:跑项目自己的 runner。
  # run_all.py 会自己起一个带假模型的服务来跑渲染检查,跑完关掉 ——
  # 不联网、不调模型、不花钱,所以也不需要任何 API Key。
  # ------------------------------------------------------------------
  test:
    name: 全部测试 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 环境信息
        run: |
          python --version
          node --version

      - name: 跑全部测试
        run: python tests/run_all.py

  # ------------------------------------------------------------------
  # 文档与仓库自检:死链、密钥、私人数据、JSON、CITATION
  # ------------------------------------------------------------------
  docs:
    name: 文档自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 检查死链 / 密钥 / 私人数据
        run: python tests/docs_check.py

  # ------------------------------------------------------------------
  # 语法检查:确认没有语法错误(不依赖任何第三方 linter —— 本项目零依赖)
  # ------------------------------------------------------------------
  syntax:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python 语法
        run: |
          python -m compileall -q app tests _probe _capability fk_tool
          echo "Python 语法检查通过"

      - name: 前端 JS 语法
        run: |
          node --check app/web/app.js
          for f in tests/*.mjs; do node --check "$f"; done
          echo "JS 语法检查通过"

  # ------------------------------------------------------------------
  # 界面冒烟:确认服务真的能起来、健康检查有响应
  # ------------------------------------------------------------------
  smoke:
    name: 启动冒烟
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 起服务并探活
        shell: bash
        run: |
          python app/fk_server.py --port 8231 --no-browser &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8231/api/health > /dev/null; then
              echo "服务已就绪"
              curl -fsS http://127.0.0.1:8231/api/shelf
              echo
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "服务没有在 20 秒内就绪"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
