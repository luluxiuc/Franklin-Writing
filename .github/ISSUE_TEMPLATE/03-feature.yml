name: 功能建议
description: 提一个改动或新增
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **开之前请先读 [CONTRIBUTING.md](https://github.com/luluxiuc/Franklin-Writing/blob/main/CONTRIBUTING.md) 里的「不会被接受的贡献」那一节。**

        有一类建议会被直接拒绝，提前说清楚免得你白写：**任何让工具评判写作的功能**
        （评分、相似度、"像不像作者"、等级、自动改稿建议）。这不是偏好问题，是实测结论，
        依据在 [docs/研究](https://github.com/luluxiuc/Franklin-Writing/tree/main/docs/研究)。

        拿不准的、还没想清楚的，**去 [Discussions](https://github.com/luluxiuc/Franklin-Writing/discussions) 聊，不要开 Issue。**

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 先说问题，再说方案。你实际练习时卡在哪一步？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么变
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的别的办法
      description: 现在的版本里有没有能凑合用的做法？手动流程也算。

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      description: 这几条是项目的硬约束，请确认你的建议不与它们冲突。
      options:
        - label: 这个建议不会让工具评判、评分或评价我的写作
          required: true
        - label: 这个建议不需要引入第三方依赖（pip / npm / CDN）
          required: true
        - label: 这个建议不需要联网、账号或云端存储
